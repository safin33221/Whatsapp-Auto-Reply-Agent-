version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "safin33221", email = "safin33221@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.4.6",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.4.2",
    "langchain-groq>=1.1.3",
